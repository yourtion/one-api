# 构建 VitePress 文档站并部署到 GitHub Pages
# 触发：push 到 main（docs 相关文件变更时）
#
# 首次使用前需在仓库 Settings → Pages → Source 选 "GitHub Actions"
# （无需手动创建 gh-pages 分支，Actions 直接部署）
name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'apps/server/src/routes/**'
      - 'apps/server/src/api/**'
      - 'apps/server/src/__tests__/helpers.ts'
      - 'packages/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，跳过排队中的旧 run，但不中断进行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # 版本由 package.json 的 packageManager 字段决定

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 文档站的 API 参考由 erest test-agent 跑真实请求生成，
      # 需要 server 源码先 build（gen-api-docs 跨包 import server 源码经 tsx 转译）
      - name: Build packages
        run: pnpm -r build

      # 生成 API 参考 markdown（复用 setupTest 跑 test-agent → ✅ + 真实示例）+ 构建 VitePress 站点
      - name: Build docs site
        run: pnpm --filter @1api/docs docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
